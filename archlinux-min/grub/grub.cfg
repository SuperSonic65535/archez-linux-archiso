# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output console
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Get the lowercase UEFI machine type short-name to use for architecture-specific tools
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' ]; then
        uefi_machine_type_lower='x64'
    elif [ "${grub_cpu}" == 'i386' ]; then
        uefi_machine_type_lower='ia32'
    elif [ "${grub_cpu}" == 'arm64' ]; then
        uefi_machine_type_lower='aa64'
    elif [ "${grub_cpu}" == 'riscv64' ]; then
        uefi_machine_type_lower='riscv64'
    elif [ "${grub_cpu}" == 'loongarch64' ]; then
        uefi_machine_type_lower='loongarch64'
    fi
fi

# Set default menu entry
default=archlinux
timeout=10
timeout_style=menu


# Menu entries

menuentry "Boot/Install Arch Linux (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% copytoram=n fsck.mode=skip lockdown=integrity lsm=landlock,lockdown,yama,integrity,bpf amd_iommu=on intel_iommu=on iommu.passthrough=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}
menuentry "Load to RAM and Boot/Install Arch Linux (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archisosearchuuid=%ARCHISO_UUID% copytoram=auto fsck.mode=skip lockdown=integrity lsm=landlock,lockdown,yama,integrity,bpf amd_iommu=on intel_iommu=on iommu.passthrough=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}
