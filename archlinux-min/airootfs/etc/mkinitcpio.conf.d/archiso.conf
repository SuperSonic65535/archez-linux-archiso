#HOOKS=(base udev modconf archiso block filesystems)
HOOKS=(base udev modconf archiso)
MODULES=(overlay iso9660 squashfs
	sd_mod sr_mod
	ahci ata_generic pata_acpi
	nvme nvme_core
	usb_storage uas ehci_pci xhci_pci
	mmc_block sdhci sdhci_pci
	virtio_blk virtio_pci
)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
MODULES_DECOMPRESS="yes"
MISSING_FIRMWARE_WARNING="no"
